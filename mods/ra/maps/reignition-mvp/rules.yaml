Player:
	PlayerResources:
		DefaultCash: 4000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, reignition-mvp.lua, reignition-mvp-ai.lua
	MissionData:
		Briefing: reignition-briefing
	MapOptions:
		TechLevel: medium
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: reignition-difficulty.label
		Description: reignition-difficulty.description
		Values:
			easy: reignition-difficulty.easy
			normal: reignition-difficulty.normal
			hard: reignition-difficulty.hard
		Default: normal

