		Prerequisites: weap, ~vehicles.allies, ~techlevel.medium
		Description: reignition-actor-iris-description
	Tooltip:
		Name: reignition-actor-iris
		GenericName: reignition-actor-iris
	GrantConditionOnDeploy:
		DeployedCondition: deployed
		SkipMakeAnimation: true
		UndeployOnMove: true
