# Static concept artwork for the standard Red Alert unit roster.
# The source artwork contains one view, so the sprite body and turret overlays
# are disabled where the image already includes the complete unit silhouette.

DD:
	RenderSprites:
		Image: reignition-dd
	-WithSpriteTurret:
	-WithDamageOverlay:
	Armament@SECONDARY:
		Name: depth-charge
		Weapon: DepthCharge

