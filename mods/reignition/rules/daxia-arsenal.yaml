# Daxia variants use the supplied unit artwork and their own production chain.
# Load only in Reignition's base-building maps, before map-specific rules.

AFLD.DAXIA:
	Inherits: AFLD
	Buildable:
		Prerequisites: ~daxia-human-arsenal, dome, ~structures.allies, ~techlevel.medium
		Description: reignition-daxia-airfield.description
	Tooltip:
		Name: reignition-daxia-airfield.name
	RenderSprites:
		Image: afld
	ProvidesPrerequisite@buildingname:
		Prerequisite: afld.daxia
	-AirstrikePower@spyplane:
	-ParatroopersPower@paratroopers:
	-AirstrikePower@parabombs:

MIG.DAXIA:
	Inherits: MIG
	Buildable:
		Prerequisites: ~daxia-human-arsenal, ~afld.daxia, atek, ~techlevel.high
		Description: reignition-daxia-mig.description
	Tooltip:
		Name: reignition-daxia-mig.name
	Rearmable:
		RearmActors: afld.daxia, afld, afld.ukraine

4TNK.DAXIA:
	Inherits: 4TNK
	Buildable:
		Prerequisites: ~daxia-human-arsenal, fix, atek, ~vehicles.allies, ~techlevel.high
	Tooltip:
		Name: reignition-daxia-heavy-tank
		GenericName: reignition-daxia-heavy-tank

FTRK.DAXIA:
	Inherits: FTRK
	Buildable:
		Prerequisites: ~daxia-human-arsenal, ~vehicles.allies, ~techlevel.low
	Tooltip:
		Name: reignition-daxia-flak-track

TTNK.DAXIA:
	Inherits: TTNK
	Buildable:
		Prerequisites: ~daxia-human-arsenal, dome, atek, ~vehicles.allies, ~techlevel.high
	Tooltip:
		Name: reignition-daxia-tesla-tank
		GenericName: reignition-daxia-tesla-tank

V2RL.DAXIA:
	Inherits: V2RL
	Buildable:
		Prerequisites: ~daxia-human-arsenal, dome, ~vehicles.allies, ~techlevel.medium
	Tooltip:
		Name: reignition-daxia-missile-launcher

SS.DAXIA:
	Inherits: SS
	Buildable:
		BuildAtProductionType: Boat
		Prerequisites: ~daxia-human-arsenal, ~syrd, ~techlevel.low
	Tooltip:
		Name: reignition-daxia-submarine

APC.DAXIA:
	Inherits: APC
	Buildable:
		Prerequisites: ~daxia-human-arsenal, ~vehicles.allies, ~techlevel.low
	Tooltip:
		Name: reignition-daxia-apc

KIROV.DAXIA:
	Inherits: ^Helicopter
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 60
		Prerequisites: ~daxia-human-arsenal, ~hpad, atek, ~aircraft.allies, ~techlevel.high
		Description: reignition-daxia-kirov.description
	Valued:
		Cost: 2500
	Tooltip:
		Name: reignition-daxia-kirov.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 12
		Speed: 40
		IdleBehavior: None
	RevealsShroud:
		MinRange: 5c0
		Range: 7c0
		Type: GroundPosition
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 5c0
		Type: GroundPosition
	Armament:
		Weapon: ReignitionKirovBomb
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 512
		OpportunityFire: False
		ForceFireIgnoresActors: True
	RenderSprites:
		Image: reignition-kirov
	SpawnActorOnDeath:
		Actor: BADR.Husk
	Selectable:
		Bounds: 2048, 1536
		DecorationBounds: 2304, 1792

# Reserve the added arsenal for human players. The inherited RA AI roster stays
# intact; all four lobby bot types are denied this production prerequisite.
Player:
	ProvidesPrerequisite@DAXIAHUMANARSENAL:
		Prerequisite: daxia-human-arsenal
		RequiresCondition: !(enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai)
