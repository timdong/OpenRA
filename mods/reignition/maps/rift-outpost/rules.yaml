Player:
	PlayerResources:
		DefaultCash: 4000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, reignition-mvp.lua, reignition-mvp-ai.lua
	MissionData:
		Briefing: reignition-briefing
	MapOptions:
		TechLevel: unrestricted
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: reignition-difficulty.label
		Description: reignition-difficulty.description
		Values:
			easy: reignition-difficulty.easy
			normal: reignition-difficulty.normal
			hard: reignition-difficulty.hard
		Default: normal

# Buildings and units inherit the complete RA production tree. Keep faction and
# building prerequisites; do not reintroduce the former MVP disable list.

TECH.CAM:
	Inherits: CAMERA
	RevealsShroud:
		Range: 4c0
		Type: CenterPosition

2TNK:
	Buildable:
		Prerequisites: weap, ~vehicles.allies, ~techlevel.medium
		Description: reignition-actor-iris-description
	Tooltip:
		Name: reignition-actor-iris
		GenericName: reignition-actor-iris
	GrantConditionOnDeploy:
		DeployedCondition: deployed
		SkipMakeAnimation: true
		UndeployOnMove: true
	Mobile:
		RequiresCondition: !deployed
	RangeMultiplier@DEPLOYED:
		RequiresCondition: deployed
		Modifier: 150
	ReloadDelayMultiplier@DEPLOYED:
		RequiresCondition: deployed
		Modifier: 75

